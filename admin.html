<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin RNPPU</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100">

<header class="bg-blue-900 text-white p-4 flex items-center justify-between md:hidden fixed top-0 w-full z-50 shadow">
  <h1 class="font-bold text-lg">Admin RNPPU</h1>
  <button onclick="toggleSidebar()" class="text-3xl">☰</button>
</header>

<div class="flex h-screen pt-16 md:pt-0">
  <aside id="sidebar" class="w-64 bg-blue-900 text-white p-5 fixed md:static h-full z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
    <h1 class="text-xl font-bold mb-8 hidden md:block">Admin RNPPU</h1>
    <nav class="space-y-2">
      <!-- 1. MENU ARTIKEL DIKASI BG-BLUE-700 DEFAULT -->
      <button onclick="showTab('tentang', this)" class="menu-btn w-full text-left p-3 rounded hover:bg-blue-700 flex items-center gap-3">📄 <span>Tentang</span></button>
      <button onclick="showTab('artikel', this)" class="menu-btn w-full text-left p-3 rounded hover:bg-blue-700 flex items-center gap-3 bg-blue-700">📰 <span>Artikel</span></button>
      <button onclick="showTab('anggota', this)" class="menu-btn w-full text-left p-3 rounded hover:bg-blue-700 flex items-center gap-3">👥 <span>Anggota</span></button>
      <button onclick="showTab('pengurus', this)" class="menu-btn w-full text-left p-3 rounded hover:bg-blue-700 flex items-center gap-3">👨‍✈️ <span>Pengurus</span></button>
    </nav>
  </aside>
  <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden"></div>

  <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full">
    <!-- 2. TENTANG DIKASI HIDDEN DEFAULT -->
    <div id="tentang" class="tab-content hidden bg-white p-6 rounded-xl shadow">
      <h2 class="text-2xl font-bold mb-4">Edit Tentang & Sambutan</h2>
      <label class="font-bold">Sambutan Ketua</label><textarea id="tentangTxt" class="w-full border p-3 rounded mb-3 h-32"></textarea>
      <label class="font-bold">Visi</label><textarea id="visiTxt" class="w-full border p-3 rounded mb-3 h-24"></textarea>
      <label class="font-bold">Misi</label><textarea id="misiTxt" class="w-full border p-3 rounded mb-3 h-24"></textarea>
      <button onclick="saveTentang()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold w-full md:w-auto">Simpan</button>
      <p id="statusTentang" class="mt-3 font-bold"></p>
    </div>

    <!-- 3. ARTIKEL DIHAPUS HIDDEN NE BEN MUNCUL DEFAULT -->
    <div id="artikel" class="tab-content bg-white p-6 rounded-xl shadow">
      <h2 class="text-2xl font-bold mb-4">Kelola Artikel</h2>
      <input type="hidden" id="editIdArtikel">
      <input id="judul" type="text" placeholder="Judul Artikel" class="w-full border p-3 rounded mb-3">
      <textarea id="isi" placeholder="Isi Artikel" class="w-full border p-3 rounded mb-3 h-40"></textarea>
      <label class="font-bold">Upload Gambar</label><input type="file" id="gambar" accept="image/*" class="w-full p-2 mb-3 border rounded">
      <p class="text-xs text-gray-500 mb-3">*Auto kompres max 1200px</p>

      <label class="font-bold">Link Video Google Drive</label>
      <input id="videoLink" type="text" placeholder="https://drive.google.com/file/d/.../preview" class="w-full border p-3 rounded mb-1">
      <p class="text-xs text-gray-500 mb-3">Carane: Upload ke Drive > Bagikan > Siapa saja > Copy link > ganti /view dadi /preview</p>

      <button onclick="saveArtikel()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold w-full md:w-auto">Simpan Artikel</button>
      <p id="statusArtikel" class="mt-3 font-bold"></p><hr class="my-6">
      <h3 class="font-bold mb-3">Daftar Artikel</h3><div id="listArtikel" class="space-y-3 max-h-96 overflow-y-auto"></div>
    </div>

    <div id="anggota" class="tab-content hidden bg-white p-6 rounded-xl shadow">
      <h2 class="text-2xl font-bold mb-4">Kelola Anggota</h2>
      <input type="hidden" id="editIdAnggota">
      <input id="namaA" type="text" placeholder="Nama Anggota" class="w-full border p-3 rounded mb-3">
      <input id="alamatA" type="text" placeholder="Alamat" class="w-full border p-3 rounded mb-3">
      <input id="kapalA" type="text" placeholder="Nama Kapal" class="w-full border p-3 rounded mb-3">
      <p class="font-bold mb-2">Pilih Wilayah:</p>
      <div class="flex gap-3 mb-4">
        <button type="button" onclick="setWilayah('Belandongan Wetan')" id="btnWetan" class="flex-1 p-3 rounded-lg font-bold bg-blue-700 text-white">Belandongan Wetan</button>
        <button type="button" onclick="setWilayah('Belandongan Kulon')" id="btnKulon" class="flex-1 p-3 rounded-lg font-bold bg-gray-300 text-gray-700">Belandongan Kulon</button>
      </div>
      <button onclick="saveAnggota()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-bold w-full md:w-auto">Simpan Anggota</button>
      <p id="statusAnggota" class="mt-3 font-bold"></p><hr class="my-6">
      <h3 class="font-bold mb-3">Daftar Anggota</h3><div id="listAnggota" class="space-y-2 max-h-96 overflow-y-auto"></div>
    </div>

    <div id="pengurus" class="tab-content hidden bg-white p-6 rounded-xl shadow">
      <h2 class="text-2xl font-bold mb-4">Kelola Pengurus</h2>
      <input type="hidden" id="editIdPengurus">
      <input id="namaP" type="text" placeholder="Nama Pengurus" class="w-full border p-3 rounded mb-3">
      <input id="jabatanP" type="text" placeholder="Jabatan" class="w-full border p-3 rounded mb-3">
      <button onclick="savePengurus()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg font-bold w-full md:w-auto">Simpan Pengurus</button>
      <p id="statusPengurus" class="mt-3 font-bold"></p><hr class="my-6">
      <h3 class="font-bold mb-3">Daftar Pengurus</h3><div id="listPengurus" class="space-y-2 max-h-96 overflow-y-auto"></div>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = "https://itmdkfqlrruoafwbynam.supabase.co";
const SUPABASE_KEY = "sb_publishable_mnYJXj_CVswO5TY0kcXnbA_-VeT3Zko";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let wilayahPilihan = "Belandongan Wetan";

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('-translate-x-full');
  document.getElementById('overlay').classList.toggle('hidden');
}
function showTab(id, el){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('bg-blue-700'));
  el.classList.add('bg-blue-700');
  if(window.innerWidth < 768) toggleSidebar();
}
function setWilayah(w){
  wilayahPilihan=w;
  btnWetan.className=btnKulon.className="flex-1 p-3 rounded-lg font-bold bg-gray-300 text-gray-700";
  if(w=="Belandongan Wetan")btnWetan.className="flex-1 p-3 rounded-lg font-bold bg-blue-700 text-white";
  if(w=="Belandongan Kulon")btnKulon.className="flex-1 p-3 rounded-lg font-bold bg-blue-700 text-white";
}
function kompresGambar(file,callback){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();img.src=e.target.result;
    img.onload=()=>{
      const c=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>1200){h*=1200/w;w=1200}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      callback(c.toDataURL('image/jpeg',0.7).split(",")[1])
    }
  };
  reader.readAsDataURL(file)
}

// CRUD TENTANG
async function saveTentang(){
  const {error} = await supabaseClient.from('tentang').update({tentang:tentangTxt.value,visi:visiTxt.value,misi:misiTxt.value}).eq('id',1);
  statusTentang.innerText = error? "❌ Gagal Simpan: " + error.message : "✅ Data Berhasil Disimpan";
  statusTentang.className = error? "mt-3 font-bold text-red-600" : "mt-3 font-bold text-green-600";
}

// CRUD ARTIKEL + VIDEO
async function saveArtikel(){
  statusArtikel.innerText="⏳ Menyimpan...";
  const id=editIdArtikel.value;const file=gambar.files[0];let url="";
  if(file){
    statusArtikel.innerText="⏳ Upload gambar...";
    const blob=await new Promise(r=>kompresGambar(file,r));
    const fileName=Date.now()+"_"+file.name;
    const {error:errUpload} = await supabaseClient.storage.from('foto-artikel').upload(fileName,await(await fetch("data:image/jpeg;base64,"+blob)).blob());
    if(errUpload){ statusArtikel.innerText="❌ Gagal Upload: " + errUpload.message; return; }
    url=SUPABASE_URL+"/storage/v1/object/public/foto-artikel/"+fileName;
  }
  const tglExp = new Date();tglExp.setDate(tglExp.getDate()+30);
  const data={tanggal:new Date(),judul:judul.value,isi:isi.value,gambar_link:url,video_link:videoLink.value,durasi:"30 Hari",tgl_expired:tglExp};
  const res = id? await supabaseClient.from('artikel').update(data).eq('id',id) : await supabaseClient.from('artikel').insert([data]);
  statusArtikel.innerText=res.error?"❌ Gagal DB: " + res.error.message:"✅ Artikel Tersimpan";
  if(!res.error){ resetFormArtikel();loadArtikel(); }
}
function resetFormArtikel(){editIdArtikel.value="";judul.value="";isi.value="";gambar.value="";videoLink.value="";}
async function loadArtikel(){const {data}=await supabaseClient.from('artikel').select('*').order('tanggal',{ascending:false});listArtikel.innerHTML=data&&data.length>0?data.map(a=>`<div class="p-3 border rounded-lg flex justify-between items-center"><span class="font-bold">${a.judul}</span><div><button onclick='editArtikel(${JSON.stringify(a)})' class="text-blue-600 mr-3 font-bold">Edit</button><button onclick='hapusArtikel(${a.id})' class="text-red-600 font-bold">Hapus</button></div></div>`).join(''):"<p>Belum ada artikel</p>"}
function editArtikel(a){editIdArtikel.value=a.id;judul.value=a.judul;isi.value=a.isi;videoLink.value=a.video_link||"";showTab('artikel', document.querySelectorAll('.menu-btn')[1]);}
async function hapusArtikel(id){if(confirm("Yakin hapus artikel ini?")){await supabaseClient.from('artikel').delete().eq('id',id);loadArtikel();}}

// CRUD ANGGOTA
async function saveAnggota(){const id=editIdAnggota.value;const data={nama:namaA.value,alamat:alamatA.value,kapal:kapalA.value,wilayah:wilayahPilihan};const res=id? await supabaseClient.from('anggota').update(data).eq('id',id) : await supabaseClient.from('anggota').insert([data]);statusAnggota.innerText=res.error?"❌ Gagal: " + res.error.message:"✅ Anggota Tersimpan";if(!res.error){resetFormAnggota();loadAnggota();}}
function resetFormAnggota(){editIdAnggota.value="";namaA.value="";alamatA.value="";kapalA.value="";}
async function loadAnggota(){const {data}=await supabaseClient.from('anggota').select('*').order('nama');listAnggota.innerHTML=data&&data.length>0?data.map(a=>`<div class="p-3 border rounded-lg flex justify-between items-center"><div><p class="font-bold">${a.nama}</p><p class="text-xs">${a.wilayah}</p></div><div><button onclick='editAnggota(${JSON.stringify(a)})' class="text-blue-600 mr-3 font-bold">Edit</button><button onclick='hapusAnggota(${a.id})' class="text-red-600 font-bold">Hapus</button></div></div>`).join(''):"<p>Belum ada data</p>"}
function editAnggota(a){editIdAnggota.value=a.id;namaA.value=a.nama;alamatA.value=a.alamat;kapalA.value=a.kapal;setWilayah(a.wilayah);showTab('anggota', document.querySelectorAll('.menu-btn')[2]);}
async function hapusAnggota(id){if(confirm("Yakin hapus anggota ini?")){await supabaseClient.from('anggota').delete().eq('id',id);loadAnggota();}}

// CRUD PENGURUS
async function savePengurus(){const id=editIdPengurus.value;const data={nama:namaP.value,jabatan:jabatanP.value};const res=id? await supabaseClient.from('pengurus').update(data).eq('id',id) : await supabaseClient.from('pengurus').insert([data]);statusPengurus.innerText=res.error?"❌ Gagal: " + res.error.message:"✅ Pengurus Tersimpan";if(!res.error){resetFormPengurus();loadPengurus();}}
function resetFormPengurus(){editIdPengurus.value="";namaP.value="";jabatanP.value="";}
async function loadPengurus(){const {data}=await supabaseClient.from('pengurus').select('*').order('id');listPengurus.innerHTML=data&&data.length>0?data.map(p=>`<div class="p-3 border rounded-lg flex justify-between items-center"><div><p class="font-bold">${p.nama}</p><p class="text-xs">${p.jabatan}</p></div><div><button onclick='editPengurus(${JSON.stringify(p)})' class="text-blue-600 mr-3 font-bold">Edit</button><button onclick='hapusPengurus(${p.id})' class="text-red-600 font-bold">Hapus</button></div></div>`).join(''):"<p>Belum ada data</p>"}
function editPengurus(p){editIdPengurus.value=p.id;namaP.value=p.nama;jabatanP.value=p.jabatan;showTab('pengurus', document.querySelectorAll('.menu-btn')[3]);}
async function hapusPengurus(id){if(confirm("Yakin hapus pengurus ini?")){await supabaseClient.from('pengurus').delete().eq('id',id);loadPengurus();}}

// INIT
supabaseClient.from('tentang').select('*').eq('id',1).single().then(({data, error})=>{
  if(error) statusTentang.innerText = "❌ Gagal load: " + error.message;
  if(data){tentangTxt.value=data.tentang||'';visiTxt.value=data.visi||'';misiTxt.value=data.misi||'';}
});
loadArtikel();loadAnggota();loadPengurus();
</script></body></html>
