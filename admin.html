<!DOCTYPE html>
<html>
<head><title>Admin</title></head>
<body>
<h2>Tambah Artikel</h2>
<form id="formArtikel">
  <input id="judul" placeholder="Judul" required><br><br>
  <textarea id="isi" placeholder="Isi" rows="5" required></textarea><br><br>
  <input type="file" id="gambar" accept="image/*" required><br><br>
  <button type="button" onclick="uploadArtikel()">Kirim Artikel</button>
</form>

<h2>Tambah Anggota</h2>
<form id="formAnggota">
  <input id="nama" placeholder="Nama" required><br><br>
  <input id="jabatan" placeholder="Jabatan" required><br><br>
  <input id="kapal" placeholder="Nama Kapal" required><br><br>
  <button type="button" onclick="tambahAnggota()">Tambah Anggota</button>
</form>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyS6DrMynLro_-EyE6kYYpt57z2WFnJghjgq3VuFlxdLZioKuy7_DYSCIE1YlVFCW5JYw/exec";

function uploadArtikel() {
  const file = document.getElementById('gambar').files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = {
      action: "add", sheet: "artikel",
      tanggal: new Date().toLocaleDateString('id-ID'),
      judul: document.getElementById('judul').value,
      isi: document.getElementById('isi').value,
      gambar: e.target.result.split(',')[1],
      namaFile: file.name
    };
    fetch(API_URL, {method: 'POST', body: JSON.stringify(data)})
   .then(res => res.text()).then(() => {
      alert("Artikel berhasil!");
      document.getElementById('formArtikel').reset();
    });
  }
  if(file){ reader.readAsDataURL(file); }
}

function tambahAnggota() {
  const data = {
    action: "addAnggota", sheet: "anggota",
    nama: document.getElementById('nama').value,
    jabatan: document.getElementById('jabatan').value,
    kapal: document.getElementById('kapal').value
  };
  fetch(API_URL, {method: 'POST', body: JSON.stringify(data)})
 .then(res => res.text()).then(() => {
    alert("Anggota berhasil!");
    document.getElementById('formAnggota').reset();
  });
}
</script>
</body>
</html>
