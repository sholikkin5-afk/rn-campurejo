<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Desa Campurjo</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">

<div class="max-w-3xl mx-auto">
  <h1 class="text-3xl font-bold text-center mb-8">Dashboard Admin</h1>

  <!-- FORM ARTIKEL -->
  <div class="bg-white p-6 rounded-xl shadow-md mb-6">
    <h2 class="text-xl font-bold mb-4 text-blue-800">Tambah Artikel</h2>
    <input id="judul" type="text" placeholder="Judul Artikel" class="w-full border border-gray-300 p-3 rounded-lg mb-3 focus:ring-2 focus:ring-blue-500">
    <textarea id="isi" placeholder="Isi Artikel" class="w-full border border-gray-300 p-3 rounded-lg mb-3 h-32 focus:ring-2 focus:ring-blue-500"></textarea>
    <input type="file" id="gambar" accept="image/*" class="w-full border-gray-300 p-2 rounded-lg mb-2">
    <p id="infoKompres" class="text-xs text-gray-500 mb-4">Foto otomatis dikompres ben gak abot</p>
    <button onclick="kirim()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700">Kirim Artikel</button>
    <p id="statusArtikel" class="mt-3 text-center font-semibold"></p>
  </div>

  <!-- FORM ANGGOTA -->
  <div class="bg-white p-6 rounded-xl shadow-md">
    <h2 class="text-xl font-bold mb-4 text-green-800">Tambah Data Anggota</h2>
    <input id="nama" type="text" placeholder="Nama Lengkap" class="w-full border border-gray-300 p-3 rounded-lg mb-3 focus:ring-2 focus:ring-green-500">
    <input id="jabatan" type="text" placeholder="Jabatan" class="w-full border border-gray-300 p-3 rounded-lg mb-3 focus:ring-2 focus:ring-green-500">
    <input id="kapal" type="text" placeholder="Nama Kapal" class="w-full border border-gray-300 p-3 rounded-lg mb-4 focus:ring-2 focus:ring-green-500">
    <button onclick="kirimAnggota()" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700">Tambah Anggota</button>
    <p id="statusAnggota" class="mt-3 text-center font-semibold"></p>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbycQiWh5jdq3upcz094HsC5s50igS_8hSdSOeD3c_Ks6j61zYn2NmBphwXzxCRqUG9DTw/exec";

// FUNGSI AUTO KOMPRES GAMBAR
function kompresGambar(file, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.src = e.target.result;
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 800; // Maksimal lebar 800px
      let width = img.width;
      let height = img.height;
      if(width > MAX_WIDTH){
        height *= MAX_WIDTH / width;
        width = MAX_WIDTH;
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      // Kualitas 0.7 = 70%. Ben cilik tapi tetep jelas
      const base64 = canvas.toDataURL('image/jpeg', 0.7).split(",")[1];
      callback(base64);
    }
  }
  reader.readAsDataURL(file);
}


function kirim(){
  const file = document.getElementById("gambar").files[0];
  if(!file){ alert("Pilih gambar dulu"); return; }
  if(!document.getElementById("judul").value){ alert("Isi judul dulu"); return; }
  
  document.getElementById("statusArtikel").innerText = "Mengompres & Mengirim...";
  
  kompresGambar(file, function(base64Kompres){
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "add",
        tanggal: new Date().toISOString(), // Ben iso di format
        judul: document.getElementById("judul").value,
        isi: document.getElementById("isi").value,
        gambar: base64Kompres, // IKI WES HASIL KOMPRES
        namaFile: file.name
      })
    }).then(res => res.json()).then(d => {
      document.getElementById("statusArtikel").innerText = "✅ Artikel berhasil dikirim!";
      document.getElementById("judul").value = "";
      document.getElementById("isi").value = "";
      document.getElementById("gambar").value = "";
    });
  });
}

function kirimAnggota(){
  document.getElementById("statusAnggota").innerText = "Mengirim...";
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "addAnggota",
      nama: document.getElementById("nama").value,
      jabatan: document.getElementById("jabatan").value,
      kapal: document.getElementById("kapal").value
    })
  }).then(res => res.json()).then(d => {
    document.getElementById("statusAnggota").innerText = "✅ Anggota berhasil ditambah!";
  });
}
</script>

</body>
</html>
