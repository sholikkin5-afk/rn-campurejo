<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desa Campurjo</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

<header class="bg-blue-900 text-white p-5 shadow-lg sticky top-0">
  <div class="container mx-auto">
    <h1 class="text-2xl font-bold">Desa Campurjo</h1>
    <p class="text-sm">Kecamatan Gresik, Kabupaten Gresik</p>
  </div>
</header>

<main class="container mx-auto p-4 md:p-6">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">Berita & Kegiatan Terbaru</h2>
  <div id="artikelList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <p class="text-center col-span-full">Memuat artikel...</p>
  </div>
</main>

<footer class="bg-gray-800 text-white text-center p-4 mt-8">
  <p>© 2026 Desa Campurjo</p>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyGdXCycqcKlHug5eMYkKZEr7jTztTTYeKkpIB1egKDqexg_lL6BWjwLqTsvBx8-3MTTA/exec";

fetch(API_URL)
.then(res => res.json())
.then(data => {
  if(data.length == 0){
    document.getElementById("artikelList").innerHTML = "<p class='text-center col-span-full'>Durung onok artikel</p>";
    return;
  }
  let html = "";
  data.reverse().forEach(a => {
    html += `
    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition">
      <img src="${a.gambar}" class="w-full h-48 object-cover" onerror="this.src='https://via.placeholder.com/400x200?text=Gagal+Load'">
      <div class="p-5">
        <p class="text-xs text-gray-500">${a.tanggal}</p>
        <h3 class="font-bold text-lg mt-1 text-gray-900">${a.judul}</h3>
        <p class="text-gray-700 mt-2 text-sm line-clamp-3">${a.isi}</p>
      </div>
    </div>
    `;
  });
  document.getElementById("artikelList").innerHTML = html;
}).catch(err => {
  document.getElementById("artikelList").innerHTML = "<p class='text-center col-span-full text-red-500'>Gagal memuat data</p>";
});
</script>
</body>
</html>
