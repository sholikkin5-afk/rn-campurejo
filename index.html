<!DOCTYPE html>
<html>
<head><title>Campurjo</title></head>
<body>
<h1>Website Campurjo</h1>
<div id="daftarArtikel">Loading...</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwtUZg5HG0TSCZWcDXRQlQwZwFEOwsy8_dldv0261feQZbW9HY9AazyMml_ZpWSqbVH3g/exec";

fetch(API_URL)
.then(res => res.json())
.then(data => {
  let html = "";
  data.reverse().forEach(item => {
    html += `
      <div style="border:1px solid #ccc; margin:10px; padding:10px;">
        <h3>${item.judul}</h3>
        <p><i>${item.tanggal}</i></p>
        <img src="${item.gambar}" width="300"><br>
        <p>${item.isi}</p>
      </div>
    `;
  });
  document.getElementById('daftarArtikel').innerHTML = html;
});
</script>
</body>
</html>
