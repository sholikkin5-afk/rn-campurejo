<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RNPPU Campurejo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<style>
  body { font-size: 13px; }
  @media (min-width: 768px) { body { font-size: 14px; } }
</style>
</head>
<body class="bg-gray-50 font-sans">

<header class="bg-gradient-to-r from-blue-900 to-blue-700 text-white p-3 shadow-lg sticky top-0 z-50">
  <div class="max-w-6xl mx-auto flex items-center gap-3">
    <img src="logo-rn.jpg" onerror="this.src='https://placehold.co/48x48/1e3a8a/ffffff?text=RN'" class="w-12 h-12 bg-white rounded-full p-1 object-cover border-2 border-white">
    <div>
      <h2 class="text-base md:text-lg font-bold leading-tight">RUKUN NELAYAN PUPANTARA CAMPUREJO PANCENG GRESIK</h2>
      <p class="text-[10px] opacity-80">BADAN HUKUM: AHU-0002915.AH.01.07.TAHUN 2026</p>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto p-3">
  <section id="sambutan" class="bg-white p-4 rounded-xl shadow-lg my-4 border-l-4 border-blue-700" data-aos="fade-up"></section>

  <div class="my-4" data-aos="fade-up">
    <input type="text" id="searchArtikel" placeholder="🔍 Cari berita..." class="w-full p-2.5 text-sm border-2 border-gray-200 rounded-lg focus:border-blue-500 outline-none">
  </div>

  <section>
    <h3 class="text-xl md:text-2xl font-bold text-center mb-4 text-blue-900" data-aos="fade-up">Berita & Kegiatan</h3>
    <div id="artikelList" class="grid md:grid-cols-3 gap-4">
      <div class="bg-white rounded-xl shadow animate-pulse h-72"></div>
      <div class="bg-white rounded-xl shadow animate-pulse h-72"></div>
      <div class="bg-white rounded-xl shadow animate-pulse h-72"></div>
    </div>
  </section>

<section class="bg-white p-4 rounded-xl shadow-lg my-6" data-aos="fade-up">
  <button onclick="togglePengurus()" class="w-full flex justify-between items-center">
    <h3 class="text-xl md:text-2xl font-bold text-blue-900">Struktur Pengurus</h3>
    <span id="iconPengurus" class="text-2xl text-blue-900">+</span>
  </button>
  <div id="pengurusWrapper" class="hidden mt-4">
    <div id="pengurusList" class="space-y-2"></div>
  </div>
</section>

  <section class="bg-white p-4 rounded-xl shadow-lg my-6" data-aos="fade-up">
    <h3 class="text-xl md:text-2xl font-bold text-center mb-4 text-blue-900">Data Anggota</h3>
    <div class="flex justify-center gap-3 mb-4">
      <button id="btnWetan" onclick="loadAnggota('Belandongan Wetan')" class="px-4 py-2 text-sm rounded-lg font-bold transition">Belandongan Wetan</button>
      <button id="btnKulon" onclick="loadAnggota('Belandongan Kulon')" class="px-4 py-2 text-sm rounded-lg font-bold transition">Belandongan Kulon</button>
    </div>
    <div id="anggotaList" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
  </section>
</main>

<div id="modalArtikel" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden items-center justify-center p-3">
  <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
    <div class="sticky top-0 bg-white p-3 border-b flex justify-between items-center">
      <h3 id="modalJudul" class="text-lg md:text-xl font-bold text-blue-900"></h3>
      <button onclick="tutupModal()" class="text-2xl text-gray-500 hover:text-red-500">×</button>
    </div>
    <img id="modalGambar" src="" class="w-full h-52 object-cover">
    <div id="modalVideo" class="px-4 pt-3"></div>
    <div class="p-4">
      <p id="modalTanggal" class="text-xs text-gray-500 mb-2"></p>
      <p id="modalIsi" class="text-sm text-gray-700 whitespace-pre-line leading-relaxed"></p>

      <div class="border-t mt-4 pt-3">
        <button id="btnLike" onclick="likeArtikel()" class="flex items-center gap-2 text-sm font-bold px-4 py-2 rounded-lg transition">❤️ <span id="jmlLike">0</span> Suka</button>
        <h3 class="font-bold text-base mt-4 mb-2">Komentar</h3>
        <div id="listKomentar" class="space-y-2 mb-3 max-h-52 overflow-y-auto"></div>
        <input id="namaKomen" type="text" placeholder="Nama anda" class="w-full border p-2 text-sm rounded mb-2">
        <textarea id="isiKomen" placeholder="Tulis komentar..." class="w-full border p-2 text-sm rounded mb-2 h-16"></textarea>
        <button onclick="kirimKomentar()" class="bg-blue-600 text-white px-4 py-2 text-sm rounded-lg font-bold">Kirim</button>
      </div>
    </div>
  </div>
</div>

<footer class="bg-gray-900 text-white p-5 mt-8">
  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-4 text-center md:text-left text-sm">
    <div><p class="font-bold mb-1">Sekretariat</p><p>Jl. Pantai Utara RT 001 RW 001 Campurejo Panceng Gresik 61156 Jawa Timur</p></div>
    <div><p class="font-bold mb-2">Hubungi Kami</p><div class="flex justify-center md:justify-start gap-4"><a href="https://wa.me/6281328282446" target="_blank" class="hover:scale-110 transition"><img src="wa-icon.png" alt="WhatsApp" class="w-10 h-10 rounded-2xl"></a><a href="mailto:rncamploenk@gmail.com" target="_blank" class="hover:scale-110 transition"><img src="gmail-icon.png" alt="Gmail" class="w-10 h-10 rounded-2xl"></a></div></div>
  </div>
  <p class="text-[10px] text-center mt-4 opacity-50">© 2026 RNPPU Campurejo</p>
</footer>

<script>
AOS.init();
const SUPABASE_URL = "https://itmdkfqlrruoafwbynam.supabase.co";
const SUPABASE_KEY = "sb_publishable_mnYJXj_CVswO5TY0kcXnbA_-VeT3Zko";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const hariIni = new Date().toISOString().split('T')[0];
let artikelAktif = null;

function togglePengurus(){
  const wrapper = document.getElementById('pengurusWrapper');
  const icon = document.getElementById('iconPengurus');
  wrapper.classList.toggle('hidden');
  icon.innerText = wrapper.classList.contains('hidden')? '+' : '−';
}

async function loadAll(){
  const {data:tentang} = await supabaseClient.from('tentang').select('*').eq('id',1).single();
  if(tentang){ sambutan.innerHTML = `<h3 class="text-lg font-bold mb-2 text-blue-900">Sambutan Ketua</h3><p class="text-sm text-gray-700 mb-3">${tentang.tentang}</p><div class="bg-blue-50 p-3 rounded-lg text-sm"><p class="mb-1"><b>Visi:</b> ${tentang.visi}</p><p><b>Misi:</b> ${tentang.misi}</p></div>`; }

  loadArtikel();

  const {data:pengurus} = await supabaseClient.from('pengurus').select('*').order('id');
  pengurusList.innerHTML = pengurus && pengurus.length > 0? pengurus.map(p=>`
      <div class="flex justify-between items-center p-3 bg-gray-50 hover:bg-blue-50 rounded-lg border-l-4 border-blue-600 transition">
        <div><p class="font-bold text-sm text-blue-900">${p.nama}</p><p class="text-xs text-gray-600">${p.jabatan}</p></div>
      </div>
    `).join('') : "<p class='text-sm text-center text-gray-500'>Belum ada data</p>";
  loadAnggota('Belandongan Wetan');
}

async function loadArtikel(cari=""){
  let query = supabaseClient.from('artikel').select('*').gte('tgl_expired',hariIni).order('tanggal',{ascending:false});
  if(cari) query = query.ilike('judul',`%${cari}%`);
  const {data:artikel} = await query;
  
  // AMBIL JUMLAH LIKE SAK GUS
  const artikelIds = artikel.map(a=>a.id);
  const {data:likes} = await supabaseClient.from('like').select('artikel_id');
  const likeCount = {};
  likes.forEach(l=> likeCount[l.artikel_id] = (likeCount[l.artikel_id]||0)+1 );

  artikelList.innerHTML = artikel && artikel.length > 0? artikel.map(a=>`
    <div onclick="bukaModal(${a.id})" class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl hover:-translate-y-1 transition cursor-pointer" data-aos="zoom-in">
      <img src="${a.gambar_link}" onerror="this.src='https://placehold.co/400x200'" class="w-full h-40 object-cover">
      <div class="p-3">
        <p class="text-[10px] text-gray-500">${new Date(a.tanggal).toLocaleDateString('id-ID')}</p>
        <h3 class="font-bold text-base mb-1 text-blue-900">${a.judul}</h3>
        <p class="text-sm text-gray-600 mb-2">${a.isi.substring(0,90)}...</p>
        <p class="text-xs font-bold text-red-500">❤️ ${likeCount[a.id] || 0} Suka</p>
      </div>
    </div>`).join('') : "<p class='col-span-full text-center text-gray-500 text-sm'>Belum ada artikel</p>";
}

document.getElementById('searchArtikel').addEventListener('input', (e)=>loadArtikel(e.target.value));

async function loadAnggota(wilayah){
  btnWetan.className = btnKulon.className = "px-4 py-2 text-sm rounded-lg font-bold bg-gray-200 text-gray-700 hover:bg-gray-300";
  if(wilayah=="Belandongan Wetan")btnWetan.className="px-4 py-2 text-sm rounded-lg font-bold bg-blue-700 text-white";
  if(wilayah=="Belandongan Kulon")btnKulon.className="px-4 py-2 text-sm rounded-lg font-bold bg-blue-700 text-white";
  const {data} = await supabaseClient.from('anggota').select('*').eq('wilayah',wilayah).order('nama');
  anggotaList.innerHTML = data && data.length > 0? data.map(a=>`<div class="bg-gray-100 p-3 rounded-lg border-l-4 border-blue-600"><p class="font-bold text-sm">${a.nama}</p><p class="text-xs">${a.alamat}</p><p class="text-[10px] text-blue-700 mt-1">🚤 ${a.kapal}</p></div>`).join('') : "<p class='text-center col-span-full text-gray-500 text-sm'>Belum ada data anggota</p>";
}

async function bukaModal(id){
  const {data} = await supabaseClient.from('artikel').select('*').eq('id',id).single();
  artikelAktif = data;
  modalJudul.innerText = data.judul;
  modalGambar.src = data.gambar_link;
  modalTanggal.innerText = new Date(data.tanggal).toLocaleDateString('id-ID', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  modalIsi.innerText = data.isi;
  modalVideo.innerHTML = data.video_link?`<iframe src="${data.video_link}" class="w-full h-52 md:h-80 rounded-lg" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>` : '';
  modalArtikel.classList.remove('hidden'); modalArtikel.classList.add('flex');
  loadLike(); loadKomentar();
}
function tutupModal(){ modalArtikel.classList.add('hidden'); modalArtikel.classList.remove('flex'); }

async function loadLike(){
  const {data} = await supabaseClient.from('like').select('*').eq('artikel_id',artikelAktif.id);
  jmlLike.innerText = data.length;
  
  // CEK WES LIKE OPO DURUNG
  const key = 'liked_'+artikelAktif.id;
  if(localStorage.getItem(key)){
    btnLike.className = "flex items-center gap-2 text-sm font-bold px-4 py-2 rounded-lg bg-red-500 text-white";
    btnLike.disabled = true;
  } else {
    btnLike.className = "flex items-center gap-2 text-sm font-bold px-4 py-2 rounded-lg bg-red-100 text-red-600 hover:bg-red-200";
    btnLike.disabled = false;
  }
}

async function likeArtikel(){
  const key = 'liked_'+artikelAktif.id;
  if(localStorage.getItem(key)) return alert("Wes tau like iki mas 😁");
  
  await supabaseClient.from('like').insert([{artikel_id:artikelAktif.id}]);
  localStorage.setItem(key, 'true');
  loadLike();
  loadArtikel(); // Refresh jumlah like neng kartu
}

async function loadKomentar(){
  const {data} = await supabaseClient.from('komentar').select('*').eq('artikel_id',artikelAktif.id).order('tanggal',{ascending:false});
  listKomentar.innerHTML = data && data.length > 0? data.map(k=>`<div class="bg-gray-100 p-2 rounded-lg"><p class="font-bold text-xs">${k.nama}</p><p class="text-sm">${k.komentar}</p></div>`).join('') : "<p class='text-xs text-gray-500'>Belum ada komentar</p>";
}
async function kirimKomentar(){
  if(!namaKomen.value ||!isiKomen.value) return alert('Nama dan komentar wajib diisi');
  await supabaseClient.from('komentar').insert([{tanggal:new Date(), artikel_id:artikelAktif.id, nama:namaKomen.value, komentar:isiKomen.value}]);
  namaKomen.value=""; isiKomen.value=""; loadKomentar();
}

loadAll();
</script></body></html>
