<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RNPPU Campurejo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<style>
  body { font-size: 13px; }
  @media (min-width: 768px) { body { font-size: 14px; } }
  /* Scroll munggah mudun */
  #artikelList { max-height: 70vh; overflow-y: auto; }
  /* Scrollbar ben apik */
  #artikelList::-webkit-scrollbar { width: 6px; }
  #artikelList::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 10px; }
</style>
</head>
<body class="bg-gray-50 font-sans">

<header class="bg-gradient-to-r from-blue-900 to-blue-700 text-white p-3 shadow-lg sticky top-0 z-50">
  <div class="max-w-6xl mx-auto flex items-center gap-3">
    <img src="logo-rn.jpg" onerror="this.src='https://placehold.co/48x48/1e3a8a/ffffff?text=RN'" class="w-12 h-12 bg-white rounded-full p-1 object-cover border-2 border-white">
    <div>
      <h2 class="text-base md:text-lg font-bold leading-tight">RUKUN NELAYAN PUPANTARA CAMPUREJO PANCENG GRESIK</h2>
      <p class="text-[10px] opacity-80">BADAN HUKUM: AHU-0002915.AH.01.07.TAHUN 2026</p>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto p-3">
  <section id="sambutan" class="bg-white p-4 rounded-xl shadow-lg my-4 border-l-4 border-blue-700" data-aos="fade-up"></section>

  <div class="my-4 flex gap-2" data-aos="fade-up">
    <input type="text" id="searchArtikel" placeholder="🔍 Cari berita..." class="flex-1 p-2.5 text-sm border-2 border-gray-200 rounded-lg focus:border-blue-500 outline-none">
    <button id="btnArsip" onclick="toggleArsip()" class="px-4 py-2 text-sm rounded-lg font-bold bg-gray-200 text-gray-700">Tampil Arsip</button>
  </div>

  <section>
    <h3 class="text-xl md:text-2xl font-bold text-center mb-4 text-blue-900" data-aos="fade-up">Berita & Kegiatan</h3>
    <div id="artikelList" class="grid md:grid-cols-3 gap-4 pr-1">
      <div class="bg-white rounded-xl shadow animate-pulse h-72"></div>
      <div class="bg-white rounded-xl shadow animate-pulse h-72"></div>
      <div class="bg-white rounded-xl shadow animate-pulse h-72"></div>
    </div>
  </section>

<section class="bg-white p-4 rounded-xl shadow-lg my-6" data-aos="fade-up">
  <button onclick="togglePengurus()" class="w-full flex justify-between items-center">
    <h3 class="text-xl md:text-2xl font-bold text-blue-900">Struktur Pengurus</h3>
    <span id="iconPengurus" class="text-2xl text-blue-900">+</span>
  </button>
  <div id="pengurusWrapper" class="hidden mt-4">
    <div id="pengurusList" class="space-y-2"></div>
  </div>
</section>

  <section class="bg-white p-4 rounded-xl shadow-lg my-6" data-aos="fade-up">
    <h3 class="text-xl md:text-2xl font-bold text-center mb-4 text-blue-900">Data Anggota</h3>
    <div class="flex justify-center gap-3 mb-4">
      <button id="btnWetan" onclick="loadAnggota('Belandongan Wetan')" class="px-4 py-2 text-sm rounded-lg font-bold transition">Belandongan Wetan</button>
      <button id="btnKulon" onclick="loadAnggota('Belandongan Kulon')" class="px-4 py-2 text-sm rounded-lg font-bold transition">Belandongan Kulon</button>
    </div>
    <div id="anggotaList" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
  </section>
</main>

<!-- MODAL FULL LAYAR + SLIDER GAMBAR -->
<div id="modalArtikel" class="fixed inset-0 bg-black bg-opacity-90 z-50 hidden items-center justify-center p-0">
  <div class="bg-white rounded-none md:rounded-xl shadow-2xl w-full h-full md:max-w-4xl md:w-full md:h-auto md:max-h-[95vh] overflow-y-auto relative">
    <div class="sticky top-0 bg-white p-3 border-b flex justify-between items-center z-10">
      <h3 id="modalJudul" class="text-lg md:text-2xl font-bold text-blue-900 pr-8"></h3>
      <button onclick="tutupModal()" class="text-3xl text-gray-500 hover:text-red-500 absolute right-3 top-2">×</button>
    </div>

    <!-- SLIDER GAMBAR -->
    <div id="modalGambarContainer" class="relative w-full bg-black hidden">
      <img id="modalGambar" src="" class="w-full h-[40vh] md:h-[60vh] object-contain bg-black">
      <button id="prevGambar" onclick="gantiGambar(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white text-3xl font-bold p-2 rounded-full hover:bg-black/80">‹</button>
      <button id="nextGambar" onclick="gantiGambar(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white text-3xl font-bold p-2 rounded-full hover:bg-black/80">›</button>
      <p id="indikatorGambar" class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-black/60 text-white text-xs px-3 py-1 rounded-full"></p>
    </div>

    <div id="modalVideo" class="px-4 pt-3"></div>
    <div class="p-4 md:p-6">
      <p id="modalTanggal" class="text-xs text-gray-500 mb-3"></p>
      <p id="modalIsi" class="text-sm md:text-base text-gray-700 whitespace-pre-line leading-relaxed"></p>

      <div class="border-t mt-4 pt-3">
        <button id="btnLike" onclick="likeArtikel()" class="flex items-center gap-2 text-sm font-bold px-4 py-2 rounded-lg transition">❤️ <span id="jmlLike">0</span> Suka</button>
        <h3 class="font-bold text-base mt-4 mb-2">Komentar</h3>
        <div id="listKomentar" class="space-y-2 mb-3 max-h-52 overflow-y-auto"></div>
        <input id="namaKomen" type="text" placeholder="Nama anda" class="w-full border p-2 text-sm rounded mb-2">
        <textarea id="isiKomen" placeholder="Tulis komentar..." class="w-full border p-2 text-sm rounded mb-2 h-16"></textarea>
        <button onclick="kirimKomentar()" class="bg-blue-600 text-white px-4 py-2 text-sm rounded-lg font-bold">Kirim</button>
      </div>
    </div>
  </div>
</div>

<footer class="bg-gray-900 text-white p-5 mt-8">
  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-4 text-center md:text-left text-sm">
    <div><p class="font-bold mb-1">Sekretariat</p><p>Jl. Pantai Utara RT 001 RW 001 Campurejo Panceng Gresik 61156 Jawa Timur</p></div>
    <div><p class="font-bold mb-2">Hubungi Kami</p><div class="flex justify-center md:justify-start gap-4"><a href="https://wa.me/6281328282446" target="_blank" class="hover:scale-110 transition"><img src="wa-icon.png" alt="WhatsApp" class="w-10 h-10 rounded-2xl"></a><a href="mailto:rncamploenk@gmail.com" target="_blank" class="hover:scale-110 transition"><img src="gmail-icon.png" alt="Gmail" class="w-10 h-10 rounded-2xl"></a></div></div>
  </div>
  <p class="text-[10px] text-center mt-4 opacity-50">© 2026 RNPPU Campurejo</p>
</footer>

<script>
AOS.init();
const SUPABASE_URL = "https://fbxfoorzeojsqnzcmvic.supabase.co";
const SUPABASE_KEY = "sb_publishable_Xg3DLbSsRFTsU5ZjxIylkA_JP6pUpSK";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const hariIni = new Date().toISOString().split('T')[0];
let artikelAktif = null;
let tampilkanArsip = false;
let gambarList = [];
let gambarIndex = 0;

function togglePengurus(){
  const wrapper = document.getElementById('pengurusWrapper');
  const icon = document.getElementById('iconPengurus');
  wrapper.classList.toggle('hidden');
  icon.innerText = wrapper.classList.contains('hidden')? '+' : '−';
}

function toggleArsip(){
  tampilkanArsip =!tampilkanArsip;
  btnArsip.innerText = tampilkanArsip? "Sembunyikan Arsip" : "Tampil Arsip";
  btnArsip.className = tampilkanArsip? "px-4 py-2 text-sm rounded-lg font-bold bg-orange-500 text-white" : "px-4 py-2 text-sm rounded-lg font-bold bg-gray-200 text-gray-700";
  loadArtikel(document.getElementById('searchArtikel').value);
}

async function loadAll(){
  const {data:tentang, error:errTentang} = await supabaseClient.from('tentang').select('*').eq('id',1).single();
  if(!errTentang && tentang){ sambutan.innerHTML = `<h3 class="text-lg font-bold mb-2 text-blue-900">Sambutan Ketua</h3><p class="text-sm text-gray-700 mb-3">${tentang.tentang}</p><div class="bg-blue-50 p-3 rounded-lg text-sm"><p class="mb-1"><b>Visi:</b> ${tentang.visi}</p><p><b>Misi:</b> ${tentang.misi}</p></div>`; }

  loadArtikel();

  const {data:pengurus, error:errPengurus} = await supabaseClient.from('pengurus').select('*').order('id');
  if(!errPengurus){ pengurusList.innerHTML = pengurus && pengurus.length > 0? pengurus.map(p=>`
      <div class="flex justify-between items-center p-3 bg-gray-50 hover:bg-blue-50 rounded-lg border-l-4 border-blue-600 transition">
        <div><p class="font-bold text-sm text-blue-900">${p.nama}</p><p class="text-xs text-gray-600">${p.jabatan}</p></div>
      </div>
    `).join('') : "<p class='text-sm text-center text-gray-500'>Belum ada data</p>"; }
  loadAnggota('Belandongan Wetan');
}

async function loadArtikel(cari=""){
  let query = supabaseClient.from('artikel').select('*');
  if(!tampilkanArsip) query = query.gte('tgl_expired',hariIni);
  query = query.order('tanggal',{ascending:false}).limit(3); // BATASI 3 ARTIKEL TOK
  if(cari) query = query.ilike('judul',`%${cari}%`);
  const {data:artikel, error} = await query;
  if(error){ artikelList.innerHTML = `<p class='col-span-full text-center text-red-500'>Gagal load: ${error.message}</p>`; return; }

  const artikelIds = artikel.map(a=>a.id);
  const {data:likes} = artikelIds.length > 0? await supabaseClient.from('likes').select('artikel_id').in('artikel_id', artikelIds) : {data:[]};
  const likeCount = {};
  if(likes) likes.forEach(l=> likeCount[l.artikel_id] = (likeCount[l.artikel_id]||0)+1 );

  artikelList.innerHTML = artikel && artikel.length > 0? artikel.map(a=>{
    const kadaluarsa = new Date(a.tgl_expired) < new Date();
    if(kadaluarsa){
      return `<div onclick="bukaModal(${a.id})" class="p-3 bg-gray-100 rounded-lg border-l-4 border-orange-400 cursor-pointer hover:bg-gray-200 transition" data-aos="fade-up">
        <span class="font-bold text-gray-600 text-sm">📦 ${a.judul}</span>
        <p class="text-[10px] text-gray-500">Arsip - ${new Date(a.tanggal).toLocaleDateString('id-ID')} - Klik untuk baca</p>
      </div>`
    } else {
      return `<div onclick="bukaModal(${a.id})" class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl hover:-translate-y-1 transition cursor-pointer" data-aos="zoom-in">
        <img src="${a.gambar_link}" onerror="this.src='https://placehold.co/400x200'" class="w-full h-40 object-cover">
        <div class="p-3">
          <p class="text-[10px] text-gray-500">${new Date(a.tanggal).toLocaleDateString('id-ID')}</p>
          <h3 class="font-bold text-base mb-1 text-blue-900">${a.judul}</h3>
          <p class="text-sm text-gray-600 mb-2">${a.isi.substring(0,90)}...</p>
          <p class="text-xs font-bold text-red-500">❤️ ${likeCount[a.id] || 0} Suka</p>
        </div>
      </div>`
    }
  }).join('') : "<p class='col-span-full text-center text-gray-500 text-sm'>Belum ada artikel</p>";
}

document.getElementById('searchArtikel').addEventListener('input', (e)=>loadArtikel(e.target.value));

async function loadAnggota(wilayah){
  btnWetan.className = btnKulon.className = "px-4 py-2 text-sm rounded-lg font-bold bg-gray-200 text-gray-700 hover:bg-gray-300";
  if(wilayah=="Belandongan Wetan")btnWetan.className="px-4 py-2 text-sm rounded-lg font-bold bg-blue-700 text-white";
  if(wilayah=="Belandongan Kulon")btnKulon.className="px-4 py-2 text-sm rounded-lg font-bold bg-blue-700 text-white";
  const {data} = await supabaseClient.from('anggota').select('*').eq('wilayah',wilayah).order('nama');
  anggotaList.innerHTML = data && data.length > 0? data.map(a=>`<div class="bg-gray-100 p-3 rounded-lg border-l-4 border-blue-600"><p class="font-bold text-sm">${a.nama}</p><p class="text-xs">${a.alamat}</p><p class="text-[10px] text-blue-700 mt-1">🚤 ${a.kapal}</p></div>`).join('') : "<p class='text-center col-span-full text-gray-500 text-sm'>Belum ada data anggota</p>";
}

// FUNGSI SLIDER
function gantiGambar(arah){
  gambarIndex += arah;
  if(gambarIndex < 0) gambarIndex = gambarList.length - 1;
  if(gambarIndex >= gambarList.length) gambarIndex = 0;
  modalGambar.src = gambarList[gambarIndex];
  indikatorGambar.innerText = `${gambarIndex + 1} / ${gambarList.length}`;
}

async function bukaModal(id){
  const {data, error} = await supabaseClient.from('artikel').select('*').eq('id',id).single();
  if(error){ alert("Gagal load artikel: " + error.message); return; }
  artikelAktif = data;
  modalJudul.innerText = data.judul;

  // LOGIKA GAMBAR BANYAK: PISAH KAN MAU KANTOI ','
  gambarList = [];
  if(data.gambar_link){
    gambarList = data.gambar_link.split(',').map(s=>s.trim()).filter(s=>s);
  }

  if(gambarList.length > 0){
    modalGambarContainer.classList.remove('hidden');
    gambarIndex = 0;
    modalGambar.src = gambarList[0];
    indikatorGambar.innerText = `1 / ${gambarList.length}`;
    prevGambar.classList.toggle('hidden', gambarList.length <= 1);
    nextGambar.classList.toggle('hidden', gambarList.length <= 1);
  } else {
    modalGambarContainer.classList.add('hidden');
  }

  modalTanggal.innerText = new Date(data.tanggal).toLocaleDateString('id-ID', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  modalIsi.innerText = data.isi;

  if(data.video_link){
    let videoId = '';
    if(data.video_link.includes('shorts/')){
        videoId = data.video_link.split('shorts/')[1].split('?')[0];
    } else if(data.video_link.includes('youtu.be/')){
        videoId = data.video_link.split('youtu.be/')[1].split('?')[0];
    } else {
        videoId = data.video_link.split('v=')[1].split('&')[0];
    }
    modalVideo.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" class="w-full h-52 md:h-96 rounded-lg" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  } else {
    modalVideo.innerHTML = '';
  }

  modalArtikel.classList.remove('hidden'); modalArtikel.classList.add('flex');
  loadLike(); loadKomentar();
}
function tutupModal(){ modalArtikel.classList.add('hidden'); modalArtikel.classList.remove('flex'); }

async function loadLike(){
  const {data, error} = await supabaseClient.from('likes').select('*').eq('artikel_id',artikelAktif.id);
  if(!error) jmlLike.innerText = data.length;
  const key = 'liked_'+artikelAktif.id;
  if(localStorage.getItem(key)){
    btnLike.className = "flex items-center gap-2 text-sm font-bold px-4 py-2 rounded-lg bg-red-500 text-white cursor-not-allowed";
    btnLike.disabled = true;
  } else {
    btnLike.className = "flex items-center gap-2 text-sm font-bold px-4 py-2 rounded-lg bg-red-100 text-red-600 hover:bg-red-200";
    btnLike.disabled = false;
  }
}

async function likeArtikel(){
  const key = 'liked_'+artikelAktif.id;
  if(localStorage.getItem(key)) return alert("Wes tau like iki mas 😁");
  const {error} = await supabaseClient.from('likes').insert([{artikel_id:artikelAktif.id}]);
  if(error){ alert("Gagal like: " + error.message); return; }
  localStorage.setItem(key, 'true');
  loadLike();
  loadArtikel(document.getElementById('searchArtikel').value);
}

async function loadKomentar(){
  listKomentar.innerHTML = "<p class='text-xs text-gray-400'>Loading komentar...</p>";
  const {data, error} = await supabaseClient.from('komentar').select('*').eq('artikel_id',artikelAktif.id).order('tanggal',{ascending:false});
  if(error){ listKomentar.innerHTML = `<p class='text-xs text-red-500'>Gagal load: ${error.message}</p>`; return; }
  listKomentar.innerHTML = data && data.length > 0? data.map(k=>`<div class="bg-gray-100 p-2 rounded-lg"><p class="font-bold text-xs text-blue-800">${k.nama}</p><p class="text-sm">${k.komentar}</p><p class="text-[10px] text-gray-400">${new Date(k.tanggal).toLocaleString('id-ID')}</p></div>`).join('') : "<p class='text-xs text-gray-500'>Belum ada komentar</p>";
}
async function kirimKomentar(){
  if(!namaKomen.value.trim() ||!isiKomen.value.trim()) return alert('Nama dan komentar wajib diisi');
  const {error} = await supabaseClient.from('komentar').insert([{tanggal:new Date(), artikel_id:artikelAktif.id, nama:namaKomen.value.trim(), komentar:isiKomen.value.trim()}]);
  if(error){ alert("Gagal kirim komentar: " + error.message); return; }
  namaKomen.value=""; isiKomen.value=""; loadKomentar();
}

loadAll();
</script></body></html>
