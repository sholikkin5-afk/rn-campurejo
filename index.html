<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desa Campurjo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e3a8a">
</head>
<body class="bg-gray-50 font-sans">

<header class="bg-blue-900 text-white p-5 shadow-lg sticky top-0 z-10">
  <div class="container mx-auto">
    <h1 class="text-2xl font-bold">Desa Campurjo</h1>
    <p class="text-sm opacity-90">Kecamatan Gresik, Kabupaten Gresik</p>
  </div>
</header>

<main class="container mx-auto p-4 md:p-6">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">Berita & Kegiatan Terbaru</h2>
  <div id="artikelList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <p class="text-center col-span-full text-gray-500">Memuat artikel...</p>
  </div>
</main>

<footer class="bg-gray-800 text-white text-center p-4 mt-8">
  <p>© 2026 Desa Campurjo. All Rights Reserved</p>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyGdXCycqcKlHug5eMYkKZEr7jTztTTYeKkpIB1egKDqexg_lL6BWjwLqTsvBx8-3MTTA/exec";

// FUNGSI BUAT NGGANTI TANGGAL DADI BAHASA INDONESIA
function formatTanggal(tgl){
  if(!tgl) return "";
  const options = { day: 'numeric', month: 'long', year: 'numeric' };
  return new Date(tgl).toLocaleDateString('id-ID', options)
}

fetch(API_URL)
.then(res => res.json())
.then(data => {
  if(data.length == 0){
    document.getElementById("artikelList").innerHTML = "<p class='text-center col-span-full text-gray-500'>Durung onok artikel. Cek meneh sesuk.</p>";
    return;
  }
  let html = "";
  data.reverse().forEach(a => {
    // BEN GAMBAR GAK ZONK: lek kosong nganggo placeholder
    const gambarUrl = a.gambar || 'https://via.placeholder.com/400x250/1e3a8a/FFFFFF?text=Desa+Campurjo';
    
    html += `
    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition duration-300">
      <img src="${gambarUrl}" 
           class="w-full h-48 object-cover bg-gray-200" 
           onerror="this.src='https://via.placeholder.com/400x250/dc2626/FFFFFF?text=Gambar+Error'">
      <div class="p-5">
        <p class="text-xs text-gray-500 mb-1">${formatTanggal(a.tanggal)}</p>
        <h3 class="font-bold text-lg text-gray-900 mb-2">${a.judul}</h3>
        <p class="text-gray-700 text-sm line-clamp-3">${a.isi}</p>
      </div>
    </div>
    `;
  });
  document.getElementById("artikelList").innerHTML = html;
}).catch(err => {
  document.getElementById("artikelList").innerHTML = "<p class='text-center col-span-full text-red-500'>Gagal memuat data. Cek internet.</p>";
});
</script>

</body>
</html>
