<!DOCTYPE html>
<html>
<head><title>Website</title></head>
<body>
<h1>Data Artikel</h1>
<div id="list"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyS6DrMynLro_-EyE6kYYpt57z2WFnJghjgq3VuFlxdLZioKuy7_DYSCIE1YlVFCW5JYw/exec";

fetch(API_URL + "?sheet=artikel")
.then(res => res.json())
.then(data => {
  let html = "";
  data.forEach(item => {
    html += `<h3>${item.judul}</h3>`;
    html += `<p>${item.tanggal}</p>`;
    html += `<p>${item.isi}</p>`;
    html += `<img src="${item.gambar}" width="300"><hr>`;
  });
  document.getElementById('list').innerHTML = html;
});
</script>
</body>
</html>
